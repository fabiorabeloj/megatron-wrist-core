name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/policy.test.mjs tests/session.test.mjs tests/demo.test.mjs
      - run: python -m unittest discover -s tests -p "test_*.py"
