name: Bug report
description: Report a reproducible problem in the prototype
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Do not include personal data, credentials or private conversations."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / Node / Python versions
